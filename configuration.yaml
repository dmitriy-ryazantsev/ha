# Home Assistant Configuration
# https://www.home-assistant.io/

# Configure a default set of components
default_config:

# Customizations
homeassistant:
  customize: !include customize.yaml

# Automations
automation: !include automations.yaml

# Scripts
script: !include scripts.yaml

# Scenes
scene: !include scenes.yaml

# Groups
group: !include groups.yaml

# Include modular automation files from directory
automation manual: !include_dir_merge_list automations/

# Include modular script files from directory
script manual: !include_dir_merge_list scripts/

# Packages for modular configurations
homeassistant:
  packages: !include_dir_named packages/
